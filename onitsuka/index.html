  <script>
    (() => {
      'use strict';
      const payload = JSON.parse(document.getElementById('encrypted-page').textContent);
      const cacheKey = 'onitsuka:london:unlocked:v1';
      const form = document.getElementById('unlock-form');
      const input = document.getElementById('password');
      const button = document.getElementById('unlock');
      const message = document.getElementById('message');
      const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));

      if (!window.crypto || !window.crypto.subtle) {
        message.textContent = '請使用支援加密功能的瀏覽器，並透過 HTTPS 開啟此頁面。';
        button.disabled = true;
        return;
      }

      // Keep the temporary gate to one prompt per browser. The cached value is
      // the already-rendered page, so the password itself is never stored.
      try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          document.open();
          document.write(cached);
          document.close();
          return;
        }
      } catch (_) {
        // Continue with the password form if storage is unavailable.
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (button.disabled) return;
        button.disabled = true;
        input.readOnly = true;
        input.removeAttribute('aria-invalid');
        button.textContent = '正在打開…';
        message.textContent = '';
        let html;
        try {
          const material = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']
          );
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', hash: 'SHA-256', salt: decode(payload.salt), iterations: payload.iterations },
            material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
          );
          const plaintext = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: decode(payload.iv) }, key, decode(payload.ciphertext)
          );
          html = new TextDecoder('utf-8', { fatal: true }).decode(plaintext);
        } catch (error) {
          message.textContent = error.name === 'OperationError'
            ? '密碼不正確，請重試（區分大小寫）。'
            : '頁面無法打開，請重新整理後再試。';
          input.value = '';
          input.readOnly = false;
          input.setAttribute('aria-invalid', 'true');
          button.disabled = false;
          button.textContent = '打開頁面';
          input.focus();
          return;
        }
        try { localStorage.setItem(cacheKey, html); } catch (_) {}
        input.value = '';
        document.open();
        document.write(html);
        document.close();
      });
    })();
  </script>
